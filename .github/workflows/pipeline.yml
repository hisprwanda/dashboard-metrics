name: CI/CD Pipeline

env:
  D2_PASSWORD: ${{secrets.D2_PASSWORD}}

on:
  # Triggers on push to any branch
  push:
    branches: ["**"]

  # Allows manual workflow dispatch with options
  workflow_dispatch:
    inputs:
      run_lint:
        description: "Run lint check"
        required: true
        type: boolean
        default: true
      run_format:
        description: "Run format check"
        required: true
        type: boolean
        default: true
      run_build:
        description: "Run build"
        required: true
        type: boolean
        default: true
      run_publish:
        description: "Deploy to DHIS2 instance"
        required: true
        type: boolean
        default: false
      target_branch:
        description: "Target environment"
        required: false
        type: choice
        options:
          - develop
          - staging
          - production
        default: develop

jobs:
  # Job 1: Lint and Format checks - runs on all branches or when selected in dispatch
  lint-and-format:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_lint == 'true' || github.event.inputs.run_format == 'true'))
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: "**/yarn.lock"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint check
        if: github.event_name == 'push' || github.event.inputs.run_lint == 'true'
        run: yarn lint

      - name: Run format check
        if: github.event_name == 'push' || github.event.inputs.run_format == 'true'
        run: yarn format:check

  # Job 2: Build - runs on develop and production branch push or when selected in dispatch
  build:
    runs-on: ubuntu-latest
    needs: lint-and-format
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/production')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_build == 'true')
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: "**/yarn.lock"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 7

  # Job 3: Publish - runs only when selected in workflow_dispatch
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_publish == 'true'
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: "**/yarn.lock"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint check
        run: yarn lint

      - name: Run format check
        run: yarn format:check

      - name: Build
        run: yarn build

      - name: Deploy to DHIS2 instance
        run: yarn d2-app-scripts deploy ${{secrets.DHIS2_BASE_URL}} --username ${{secrets.DHIS2_USERNAME}}

  # Job 4: Release - runs only on production branch push
  release:
    runs-on: ubuntu-latest
    needs: [lint-and-format, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: "**/yarn.lock"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Read version from package.json
        id: pkg_ver
        uses: notiz-dev/github-action-json-property@release
        with:
          path: package.json
          prop_path: version

      - name: Read app name from d2.config.js
        id: app_name
        run: |
          APP_NAME=$(node -e "const config = require('./d2.config.js'); console.log(config.name);")
          echo "name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Create Release Branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -b v${{ steps.pkg_ver.outputs.prop }}
          git push origin v${{ steps.pkg_ver.outputs.prop }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.pkg_ver.outputs.prop }}
          name: "v${{ steps.pkg_ver.outputs.prop }}"
          artifacts: "build/bundle/${{ steps.app_name.outputs.name }}-${{ steps.pkg_ver.outputs.prop }}.zip"
          generateReleaseNotes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            **Release Branch:** `v${{ steps.pkg_ver.outputs.prop }}`
            **Triggered by:** @${{ github.actor }}
            **Build Date:** ${{ github.event.head_commit.timestamp }}

      - name: Release Summary
        run: |
          echo "Dashboard Metrics release process completed successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | v${{ steps.pkg_ver.outputs.prop }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Tag** | v${{ steps.pkg_ver.outputs.prop }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Branch** | v${{ steps.pkg_ver.outputs.prop }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Application Bundle** | ${{ steps.app_name.outputs.name }}-${{ steps.pkg_ver.outputs.prop }}.zip |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Status** | Success |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Release Page](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.pkg_ver.outputs.prop }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Release Branch](https://github.com/${{ github.repository }}/tree/v${{ steps.pkg_ver.outputs.prop }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Download Application Bundle](https://github.com/${{ github.repository }}/releases/download/v${{ steps.pkg_ver.outputs.prop }}/${{ steps.app_name.outputs.name }}-${{ steps.pkg_ver.outputs.prop }}.zip)" >> $GITHUB_STEP_SUMMARY
